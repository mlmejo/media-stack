services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.2
    container_name: qbittorrent
    environment:
      - PUID=501
      - PGID=20
      - TZ=Asia/Manila
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent_config:/config
      - /Volumes/${MEDIA_PATH}/data:/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=Asia/Manila
    volumes:
      - ./radarr_config:/config
      - /Volumes/${MEDIA_PATH}/data:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=Asia/Manila
    volumes:
      - ./sonarr_config:/config
      - /Volumes/${MEDIA_PATH}/data:/data
    ports:
      - "8989:8989"
    restart: unless-stopped

